name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: elite-core has no terminal dependencies
        run: |
          if cargo tree -p elite-core -e normal,build,dev | grep -E '(colored|crossterm|clap) v'; then
            echo "elite-core must not depend on colored, crossterm or clap"
            exit 1
          fi
      - run: cargo build --release
