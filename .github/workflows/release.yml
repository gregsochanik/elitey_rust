name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [minor, patch]
  pull_request:
    paths: [".github/workflows/release.yml"]

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          BUMP_INPUT: ${{ inputs.bump }}
        run: |
          set -eu
          no_release() {
            echo "$1"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "version=dev" >> "$GITHUB_OUTPUT"
            exit 0
          }

          bump=""
          case "$EVENT" in
            workflow_dispatch) bump="$BUMP_INPUT" ;;
            push)
              if git tag --points-at "$SHA" | grep -q '^v'; then
                no_release "Commit is already released"
              fi
              title="$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].title // ""')"
              echo "PR title: $title"
              if echo "$title" | grep -Eq '^[a-z]+(\([^)]*\))?!:'; then
                bump=minor
              else
                case "$(echo "$title" | sed -E 's/^([a-z]+)(\([^)]*\))?:.*/\1/')" in
                  feat) bump=minor ;;
                  fix) bump=patch ;;
                esac
              fi
              ;;
          esac
          [ -n "$bump" ] || no_release "No release for this change"

          latest="$(git tag --list 'v*' --sort=-v:refname | grep -Ev -- '-' | head -1 || true)"
          latest="${latest#v}"
          latest="${latest:-0.1.0}"
          IFS=. read -r major minor patch <<< "$latest"
          if [ "$bump" = minor ]; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          version="$major.$minor.$patch"
          echo "Releasing $version ($bump bump from $latest)"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: [plan]
    if: needs.plan.outputs.release == 'true' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Set version
        if: needs.plan.outputs.release == 'true'
        shell: bash
        run: |
          py="$(command -v python3 || command -v python)"
          "$py" - <<'PY'
          import os, re
          version = os.environ["VERSION"]
          text = open("Cargo.toml").read()
          text = re.sub(r'(?m)^version = ".*"$', 'version = "%s"' % version, text, count=1)
          open("Cargo.toml", "w").write(text)
          PY
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="elitey_rust-v${VERSION}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/elitey_rust.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.target }}/release/elitey_rust" "$name/"
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
