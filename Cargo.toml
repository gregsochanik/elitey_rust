[package]
name = "elitey_rust"
version = "0.0.0-dev"
edition = "2021"
authors = ["Greg Sochanik"]
description = "Elite-style terminal trading game in Rust"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
crossterm = "0.27"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
colored = "2.0"
dirs = "5.0"
