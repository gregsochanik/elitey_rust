[package]
name = "elite-core"
description = "Rules, data and state for the Elite-style trading game"
version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
name = "elite_core"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
dirs = "5.0"
