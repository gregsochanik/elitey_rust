[package]
name = "elite-cli"
description = "Elite-style terminal trading game in Rust"
version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
name = "elite_cli"

[[bin]]
name = "elitey_rust"
path = "src/main.rs"

[dependencies]
elite-core = { path = "../elite-core" }
clap = { version = "4.0", features = ["derive"] }
crossterm = "0.27"
rand = "0.8"
anyhow = "1.0"
colored = "2.0"
comfy-table = { version = "8.0.1", features = ["custom_styling"] }

[dev-dependencies]
serde_json = "1.0"
